<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexven Drops</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <img class="avatar" id="ava" alt="" />
      <div><div class="nm" id="nick">Игрок</div><div class="muted" id="role">Nexven Drops</div></div>
      <div class="spacer"></div>
      <button class="dep" id="payBtn">+ Пополнить</button>
      <div class="bal"><img src="img/ton.svg" width="16" alt="" /><span id="bal">0.03</span></div>
    </header>
    <section id="home" class="view on"></section>
    <section id="cases" class="view"></section>
    <section id="game" class="view"></section>
    <section id="top" class="view"></section>
    <section id="profile" class="view"></section>
  </main>
  <nav class="dock" id="dock">
    <button class="on" data-tab="home">Игры</button>
    <button data-tab="cases">Кейсы</button>
    <button data-tab="top">Топ</button>
    <button data-tab="profile">Профиль</button>
  </nav>
  <div class="sheet" id="sheet"><div class="modal" id="modal"></div></div>
  <script src="app.js"></script>
</body>
</html>
