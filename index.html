<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexven Drops</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <img class="avatar" src="img/logo.jpg" alt="" />
      <div class="spacer"></div>
      <button class="dep" onclick="openPay()">+ Пополнить</button>
      <div class="bal"><img src="img/ton.svg" alt="" /><span id="bal">0.03</span></div>
    </header>
    <section id="home" class="view on"></section>
    <section id="cases" class="view"></section>
    <section id="game" class="view"></section>
    <section id="top" class="view"></section>
    <section id="profile" class="view"></section>
  </main>
  <nav class="dock">
    <button class="on" onclick="tab('home', this)">Игры</button>
    <button onclick="tab('cases', this)">Кейсы</button>
    <button onclick="tab('top', this)">Топ</button>
    <button onclick="tab('profile', this)">Профиль</button>
  </nav>
  <div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closePay()"><div class="modal" id="modal"></div></div>
  <script src="app.js"></script>
</body>
</html>
